# This is a boilerplate parameters config generated for pipelinedata_hyperparameter
# using Kedro 1.7.0.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.7.0/configuration/parameters.html

hyperparameters_options:
  param_grid:
    n_estimators: [100, 300]
    num_leaves: [7, 15]
    learning_rate: [0.03, 0.05]
    max_depth: [3, 5]
    min_child_samples: [30]
    reg_alpha: [0.5, 1.0]
    reg_lambda: [1.0, 5.0]