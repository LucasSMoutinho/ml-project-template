# Parâmetros para a divisão dos dados e modelagem
model_options:
  target_column: "Potability"  
  test_size: 0.2
  valid_size: 0.25
  random_state: 42
  features:
    - 'ph'
    - 'Hardness'
    - 'Solids'
    - 'Chloramines'
    - 'Sulfate'
    - 'Conductivity'
    - 'Organic_carbon'
    - 'Trihalomethanes'
    - 'Turbidity'